<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج — دار الشاط</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="admin-loading" id="adminLoading">
        <div class="admin-loading-spinner"></div>
        <div class="admin-loading-text">جاري التحقق من الصلاحيات...</div>
    </div>

    <div class="admin-layout" id="adminLayout" hidden>

        <aside class="admin-sidebar" id="adminSidebar"></aside>

        <div class="admin-main">

            <header class="admin-topbar" id="adminTopbar"></header>

            <main class="admin-content">

                <div class="admin-card">
                    <div class="admin-card-header">
                        <h2 class="admin-card-title" id="productViewTitle">تفاصيل المنتج</h2>
                        <div class="row-actions">
                            <button type="button" class="admin-btn" id="productViewToggleButton">تغيير الحالة</button>
                            <a class="admin-btn" id="productViewEditLink" href="#">تعديل المنتج</a>
                            <button type="button" class="admin-btn admin-btn-danger" id="productViewDeleteButton">حذف المنتج</button>
                        </div>
                    </div>

                    <div class="admin-card-body">
                        <div class="detail-grid">

                            <div class="detail-card">
                                <div class="admin-card">
                                    <div class="admin-card-body">
                                        <img id="productViewMainImage" class="gallery-main-preview" alt="الصورة الرئيسية" hidden>
                                        <div class="image-gallery" id="productViewGallery"></div>
                                    </div>
                                </div>

                                <div class="admin-card">
                                    <div class="admin-card-body">
                                        <h3 style="font-size:16px;font-weight:700;margin-bottom:6px" id="productViewName">—</h3>
                                        <p class="cell-muted" id="productViewNameEn"></p>
                                        <p style="margin-top:14px;font-size:14px;line-height:1.8" id="productViewDescription">—</p>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <div class="admin-card detail-card">
                                    <div class="admin-card-body">
                                        <div class="detail-row">
                                            <span class="detail-label">السعر</span>
                                            <span class="detail-value" id="productViewPrice">—</span>
                                        </div>
                                        <div class="detail-row">
                                            <span class="detail-label">السعر القديم</span>
                                            <span class="detail-value" id="productViewOldPrice">—</span>
                                        </div>
                                        <div class="detail-row">
                                            <span class="detail-label">التصنيف</span>
                                            <span class="detail-value" id="productViewCategory">—</span>
                                        </div>
                                        <div class="detail-row">
                                            <span class="detail-label">SKU</span>
                                            <span class="detail-value" id="productViewSku" dir="ltr">—</span>
                                        </div>
                                        <div class="detail-row">
                                            <span class="detail-label">المخزون</span>
                                            <span class="detail-value" id="productViewStock">—</span>
                                        </div>
                                        <div class="detail-row">
                                            <span class="detail-label">الحالة</span>
                                            <span class="detail-value" id="productViewStatus">—</span>
                                        </div>
                                        <div class="detail-row">
                                            <span class="detail-label">مميز</span>
                                            <span class="detail-value" id="productViewFeatured">—</span>
                                        </div>
                                        <div class="detail-row">
                                            <span class="detail-label">تاريخ الإضافة</span>
                                            <span class="detail-value" id="productViewCreated">—</span>
                                        </div>
                                        <div class="detail-row">
                                            <span class="detail-label">آخر تحديث</span>
                                            <span class="detail-value" id="productViewUpdated">—</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="admin-card detail-card">
                                    <div class="admin-card-body">
                                        <div class="detail-row">
                                            <span class="detail-label">عدد الطلبات التي تحتوي المنتج</span>
                                            <span class="detail-value" id="productViewOrdersCount">—</span>
                                        </div>
                                        <div class="detail-row">
                                            <span class="detail-label">الكمية المباعة</span>
                                            <span class="detail-value" id="productViewQuantitySold">—</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </main>

        </div>

    </div>

    <div class="admin-toast" id="adminToast" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/pages/product-view.js"></script>

</body>
</html>
