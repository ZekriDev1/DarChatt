<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإداريين — دار الشاط</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="admin-loading" id="loginLoading">
        <div class="admin-loading-spinner"></div>
        <div class="admin-loading-text">جاري التحقق من الجلسة...</div>
    </div>

    <div class="login-page" id="loginPage" hidden>

        <div class="login-card">

            <div class="login-brand">
                <img src="../assets/logo.png" alt="دار الشاط" class="login-logo">
                <h1 class="login-title">لوحة التحكم</h1>
                <p class="login-subtitle">منطقة مخصصة لإداريي دار الشاط</p>
            </div>

            <div class="login-error" id="loginError" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="login-field">
                    <label for="loginEmail">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" dir="ltr" autocomplete="email" required>
                </div>

                <div class="login-field">
                    <label for="loginPassword">كلمة المرور</label>
                    <input type="password" id="loginPassword" dir="ltr" autocomplete="current-password" required>
                </div>

                <button type="submit" class="admin-btn admin-btn-primary login-submit" id="loginSubmit">
                    <span id="loginSubmitLabel">تسجيل الدخول</span>
                </button>
            </form>

            <div class="login-note" id="loginNote">
                <p id="loginNoteTitle" style="font-weight:700;margin-bottom:6px;color:var(--danger)"></p>
                <p id="loginNoteText"></p>
                <div class="login-actions">
                    <button type="button" class="admin-btn" id="loginLogoutButton">تسجيل الخروج</button>
                    <a href="/" class="admin-btn admin-btn-primary">العودة إلى المتجر</a>
                </div>
            </div>

            <p class="login-footer">
                <a href="/signin.html">دخول العملاء</a> — متجر دار الشاط
            </p>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/pages/login.js"></script>

</body>
</html>
