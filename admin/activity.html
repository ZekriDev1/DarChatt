<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل النشاط — دار شاط</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="admin-loading" id="adminLoading">
        <div class="admin-loading-spinner"></div>
        <div class="admin-loading-text">جاري التحقق من الصلاحيات...</div>
    </div>

    <div class="admin-layout" id="adminLayout" hidden>

        <aside class="admin-sidebar" id="adminSidebar"></aside>

        <div class="admin-main">

            <header class="admin-topbar" id="adminTopbar"></header>

            <main class="admin-content">

                <div class="admin-card">
                    <div class="admin-card-header">
                        <h2 class="admin-card-title">سجل نشاط الإداريين</h2>
                    </div>

                    <div class="admin-toolbar">
                        <input
                            type="text"
                            class="admin-input"
                            id="activitySearch"
                            placeholder="بحث ببريد المسؤول..."
                            autocomplete="off"
                        >
                        <select class="admin-select" id="actionFilter">
                            <option value="all">العملية: الكل</option>
                            <option value="auth.login">تسجيل الدخول</option>
                            <option value="category.create">إضافة تصنيف</option>
                            <option value="category.update">تعديل تصنيف</option>
                            <option value="category.delete">حذف تصنيف</option>
                            <option value="product.create">إضافة منتج</option>
                            <option value="product.update">تعديل منتج</option>
                            <option value="product.delete">حذف منتج</option>
                            <option value="order.status">تغيير حالة الطلب</option>
                            <option value="settings.update">تعديل إعدادات الموقع</option>
                        </select>
                    </div>

                    <div class="admin-table-wrap">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>المسؤول</th>
                                    <th>العملية</th>
                                    <th>العنصر المتأثر</th>
                                    <th>التاريخ</th>
                                    <th>الوقت</th>
                                </tr>
                            </thead>
                            <tbody id="activityTableBody">
                                <tr>
                                    <td colspan="5" class="cell-muted">جاري تحميل السجل...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="admin-pagination" id="activityPagination" hidden>
                        <span class="admin-pagination-info" id="activityCount"></span>
                        <span class="admin-pagination-buttons" id="activityPages"></span>
                    </div>

                    <div class="admin-empty" id="activityEmpty" hidden>
                        <div class="admin-empty-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"/>
                                <path d="M12 7V12L15 14"/>
                            </svg>
                        </div>
                        <h2>لا يوجد نشاط</h2>
                        <p>ستظهر إجراءات الإداريين هنا (تسجيل الدخول، إضافة وتعديل وحذف المنتجات والتصنيفات، تغيير حالات الطلبات، تعديل الإعدادات).</p>
                    </div>
                </div>

            </main>

        </div>

    </div>

    <div class="admin-toast" id="adminToast" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/pages/activity.js"></script>

</body>
</html>
