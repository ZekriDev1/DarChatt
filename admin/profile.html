<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي — دار الشاط</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="admin-loading" id="adminLoading">
        <div class="admin-loading-spinner"></div>
        <div class="admin-loading-text">جاري التحقق من الصلاحيات...</div>
    </div>

    <div class="admin-layout" id="adminLayout" hidden>

        <aside class="admin-sidebar" id="adminSidebar"></aside>

        <div class="admin-main">

            <header class="admin-topbar" id="adminTopbar"></header>

            <main class="admin-content">

                <div class="admin-card form-card profile-card">
                    <div class="admin-card-header">
                        <h2 class="admin-card-title">الملف الشخصي</h2>
                    </div>

                    <div class="admin-card-body">

                        <div class="profile-head">
                            <span class="profile-avatar" id="profileAvatar">؟</span>
                            <div class="profile-head-info">
                                <h2 id="profileName">—</h2>
                                <p id="profileEmail">—</p>
                            </div>
                        </div>

                        <div class="admin-card detail-card" style="margin-bottom:22px">
                            <div class="admin-card-body">
                                <div class="detail-row">
                                    <span class="detail-label">الدور</span>
                                    <span class="detail-value"><span class="admin-badge admin-badge-admin">إداري</span></span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">تاريخ إنشاء الحساب</span>
                                    <span class="detail-value" id="profileCreated">—</span>
                                </div>
                            </div>
                        </div>

                        <form id="profileNameForm" novalidate>
                            <div class="form-section">
                                <h3 class="form-section-title">الاسم</h3>
                                <div class="admin-form-grid">
                                    <div class="admin-field">
                                        <label for="profileFullName">الاسم الكامل</label>
                                        <input type="text" id="profileFullName" class="admin-input" required>
                                    </div>
                                </div>
                                <div class="form-actions" style="border-top:0;padding-top:0">
                                    <button type="submit" class="admin-btn admin-btn-primary" id="profileNameSubmit">
                                        <span id="profileNameSubmitLabel">حفظ الاسم</span>
                                    </button>
                                </div>
                            </div>
                        </form>

                        <form id="profilePasswordForm" novalidate>
                            <div class="form-section">
                                <h3 class="form-section-title">تغيير كلمة المرور</h3>
                                <p class="settings-note" style="margin-bottom:18px">
                                    تُغيّر كلمة المرور عبر Supabase Auth مباشرة — لا تُخزَّن كلمات المرور في قاعدة البيانات أبداً.
                                </p>
                                <div class="admin-form-grid">
                                    <div class="admin-field">
                                        <label for="profileNewPassword">كلمة المرور الجديدة</label>
                                        <input type="password" id="profileNewPassword" class="admin-input is-ltr" dir="ltr" autocomplete="new-password">
                                        <p class="admin-field-hint">6 أحرف على الأقل.</p>
                                    </div>
                                    <div class="admin-field">
                                        <label for="profileConfirmPassword">تأكيد كلمة المرور</label>
                                        <input type="password" id="profileConfirmPassword" class="admin-input is-ltr" dir="ltr" autocomplete="new-password">
                                    </div>
                                </div>
                                <div class="form-actions" style="border-top:0;padding-top:0">
                                    <button type="submit" class="admin-btn admin-btn-primary" id="profilePasswordSubmit">
                                        <span id="profilePasswordSubmitLabel">تغيير كلمة المرور</span>
                                    </button>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>

            </main>

        </div>

    </div>

    <div class="admin-toast" id="adminToast" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/pages/profile.js"></script>

</body>
</html>
