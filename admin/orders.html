<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلبات — دار الشاط</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="admin-loading" id="adminLoading">
        <div class="admin-loading-spinner"></div>
        <div class="admin-loading-text">جاري التحقق من الصلاحيات...</div>
    </div>

    <div class="admin-layout" id="adminLayout" hidden>

        <aside class="admin-sidebar" id="adminSidebar"></aside>

        <div class="admin-main">

            <header class="admin-topbar" id="adminTopbar"></header>

            <main class="admin-content">

                <div class="admin-card">
                    <div class="admin-card-header">
                        <h2 class="admin-card-title">إدارة الطلبات</h2>
                    </div>

                    <div class="admin-toolbar">
                        <input
                            type="text"
                            class="admin-input"
                            id="orderSearch"
                            placeholder="بحث برقم الطلب أو اسم العميل أو الهاتف..."
                            autocomplete="off"
                        >
                        <select class="admin-select" id="statusFilter">
                            <option value="all">الحالة: الكل</option>
                            <option value="new">جديد</option>
                            <option value="confirmed">تم التأكيد</option>
                            <option value="processing">قيد التجهيز</option>
                            <option value="ready_to_ship">جاهز للشحن</option>
                            <option value="shipped">تم الشحن</option>
                            <option value="completed">مكتمل</option>
                            <option value="cancelled">ملغى</option>
                        </select>
                        <input type="date" class="admin-input" id="dateFrom" style="min-width:150px" title="من تاريخ">
                        <input type="date" class="admin-input" id="dateTo" style="min-width:150px" title="إلى تاريخ">
                        <select class="admin-select" id="sortSelect">
                            <option value="newest">الأحدث أولاً</option>
                            <option value="oldest">الأقدم أولاً</option>
                        </select>
                    </div>

                    <div class="admin-table-wrap">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>رقم الطلب</th>
                                    <th>العميل</th>
                                    <th>الهاتف</th>
                                    <th>المجموع</th>
                                    <th>حالة الطلب</th>
                                    <th>طريقة الدفع</th>
                                    <th>التاريخ</th>
                                    <th>الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTableBody">
                                <tr>
                                    <td colspan="8" class="cell-muted">جاري تحميل الطلبات...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="admin-pagination" id="ordersPagination" hidden>
                        <span class="admin-pagination-info" id="ordersCount"></span>
                        <span class="admin-pagination-buttons" id="ordersPages"></span>
                    </div>

                    <div class="admin-empty" id="ordersEmpty" hidden>
                        <div class="admin-empty-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 4H5L7.2 15.5H18.5L21 7H7"/>
                                <circle cx="9" cy="20" r="1"/>
                                <circle cx="18" cy="20" r="1"/>
                            </svg>
                        </div>
                        <h2 id="ordersEmptyTitle">لا توجد طلبات</h2>
                        <p id="ordersEmptyText">ستظهر الطلبات هنا فور إنشاء العملاء لها من المتجر.</p>
                    </div>
                </div>

            </main>

        </div>

    </div>

    <div class="admin-toast" id="adminToast" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/pages/orders.js"></script>

</body>
</html>
